<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with vibrant gradient -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="180" fill="#0f172a" opacity="0.4" />

  <!-- Abstract Developer Graphic -->
  <!-- Code bracket left -->
  <path d="M 120 160 L 80 200 L 120 240" fill="none" stroke="#60a5fa" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- Code bracket right -->
  <path d="M 280 160 L 320 200 L 280 240" fill="none" stroke="#f472b6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Head -->
  <circle cx="200" cy="150" r="55" fill="url(#avatarGrad)" />
  
  <!-- Shoulders / Body -->
  <path d="M 110 320 C 110 245, 150 225, 200 225 C 250 225, 290 245, 290 320 Z" fill="url(#avatarGrad)" />

  <!-- Tech Accent Ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-dasharray="10 15" />
</svg>
